[package]
name = "theya"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.10.0", features = ["client", "server", "transport-streamable-http-client"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["net", "rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
