[package]
name = "theya"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
rmcp = { version = "0.10.0", features = ["client", "server", "transport-streamable-http-client"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["net", "rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
clap = { version = "4.5.54", features = ["cargo"] }
log = { version = "0.4.29", features = ["std"] }
env_logger = "0.11.8"
toml = "1.0.6"
